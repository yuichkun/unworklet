name: Release inventory

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  api-contract:
    name: Published release inventory API contract
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
      - run: vp install
      - name: Compare live inventory with the fixed published Git range
        env:
          GH_TOKEN: ${{ github.token }}
        run: vp exec node scripts/release-inventory.integration.ts "$RUNNER_TEMP/published-inventory.json"
      - uses: actions/upload-artifact@v4
        with:
          name: published-release-inventory
          path: ${{ runner.temp }}/published-inventory.json
          if-no-files-found: error
  inventory:
    if: startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
      - run: vp install
      - name: Verify candidate inventory and CHANGELOG accounting
        env:
          GH_TOKEN: ${{ github.token }}
          LISTENED: ${{ github.event.pull_request.head.sha }}
          NOTES: ${{ github.event.pull_request.body }}
        run: vp exec node scripts/release-inventory.ts check
