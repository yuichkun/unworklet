name: Test
run-name: "Issue 145 temporary guard validation 7: cancel-gate"

# Diagnostic branch only. Never merge this workflow into the product branch.
on:
  push:
    branches: ["validate/issue145-gate-20261006"]

concurrency:
  group: issue145-gate-validation-${{ github.repository_id }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ISSUE145_GATE_SCENARIO: "cancel-gate"

jobs:
  coverage:
    name: Issue 145 validation reference control
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Create diagnostic reference marker
        run: |
          test "$GITHUB_REF" = refs/heads/validate/issue145-gate-20261006
          mkdir -p "$RUNNER_TEMP/coverage-reference"
          printf 'diagnostic-only\nsha=%s\nrun=%s\nattempt=%s\nshard=0\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            > "$RUNNER_TEMP/coverage-reference/marker.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: lang-coverage-${{ github.run_id }}-${{ github.run_attempt }}-reference
          path: ${{ runner.temp }}/coverage-reference
          if-no-files-found: error

  lang-coverage-shards:
    name: Lang coverage candidate (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [1, 2]
    steps:
      - name: Exercise the selected producer outcome
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          test "$GITHUB_REF" = refs/heads/validate/issue145-gate-20261006
          case "$ISSUE145_GATE_SCENARIO:$SHARD" in
            shard-failure:1)
              echo 'Expected diagnostic shard failure' >&2
              exit 1
              ;;
            shard-timeout:1)
              echo 'Expected diagnostic job timeout: 90-second hold exceeds one-minute job cap'
              sleep 90
              ;;
            cancel-producer:1)
              echo 'READY_FOR_SCOPED_CANCELLATION: producer hold'
              sleep 90
              ;;
          esac
      - name: Create diagnostic shard marker
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          mkdir -p "$RUNNER_TEMP/coverage-shard"
          printf 'diagnostic-only\nsha=%s\nrun=%s\nattempt=%s\nshard=%s\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$SHARD" \
            > "$RUNNER_TEMP/coverage-shard/marker.txt"
      - uses: actions/upload-artifact@v4
        if: ${{ !(env.ISSUE145_GATE_SCENARIO == 'missing-artifact' && matrix.shard == 1) }}
        with:
          name: lang-coverage-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}-of-2
          path: ${{ runner.temp }}/coverage-shard
          if-no-files-found: error

  lang-coverage-equivalence:
    name: Lang coverage shard equivalence (candidate)
    needs: [coverage, lang-coverage-shards]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Reject unsuccessful or cancelled producers
        env:
          REFERENCE_RESULT: ${{ needs.coverage.result }}
          SHARDS_RESULT: ${{ needs.lang-coverage-shards.result }}
        run: test "$REFERENCE_RESULT" = success && test "$SHARDS_RESULT" = success
      - uses: actions/download-artifact@v4
        with:
          name: lang-coverage-${{ github.run_id }}-${{ github.run_attempt }}-reference
          path: lang-coverage-inputs/reference
      - uses: actions/download-artifact@v4
        with:
          name: lang-coverage-${{ github.run_id }}-${{ github.run_attempt }}-1-of-2
          path: lang-coverage-inputs/shard-1
      - uses: actions/download-artifact@v4
        with:
          name: lang-coverage-${{ github.run_id }}-${{ github.run_attempt }}-2-of-2
          path: lang-coverage-inputs/shard-2
      - name: Hold gate for scoped cancellation
        if: env.ISSUE145_GATE_SCENARIO == 'cancel-gate'
        run: |
          echo 'READY_FOR_SCOPED_CANCELLATION: gate hold after producer guard and downloads'
          sleep 90
      - name: Validate diagnostic marker identities
        run: |
          test "$GITHUB_REF" = refs/heads/validate/issue145-gate-20261006
          for item in reference:0 shard-1:1 shard-2:2; do
            directory="${item%:*}"
            shard="${item#*:}"
            test -s "lang-coverage-inputs/$directory/marker.txt"
            expected="$(printf 'diagnostic-only\nsha=%s\nrun=%s\nattempt=%s\nshard=%s\n' \
              "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$shard")"
            test "$(cat "lang-coverage-inputs/$directory/marker.txt")" = "$expected"
          done
          echo 'Diagnostic guard and artifact checks reached completion; this is not a coverage result.'
