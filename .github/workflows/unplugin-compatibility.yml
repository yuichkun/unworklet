name: Unplugin worklet compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  selfcheck:
    name: Packed self-check (Vite ${{ matrix.vite }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        vite: [6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
      - run: vp install --frozen-lockfile
      - run: vp run build
      - name: Prepare an isolated consumer Vite
        env:
          VITE_MAJOR: ${{ matrix.vite }}
        run: |
          fixture="$RUNNER_TEMP/unworklet-vite-consumer"
          mkdir -p "$fixture"
          printf '{"private":true,"type":"module","packageManager":"pnpm@11.3.0","dependencies":{"vite":"^%s.0.0"}}\n' "$VITE_MAJOR" > "$fixture/package.json"
          cd "$fixture"
          vp install
          vp exec node --input-type=module -e 'import { writeFileSync } from "node:fs"; import { dirname } from "node:path"; import { fileURLToPath } from "node:url"; import { version } from "vite"; console.log(`Consumer Vite ${version}`); writeFileSync(process.env.GITHUB_ENV, `UWK_SELFCHECK_VITE_MODULE=${import.meta.resolve("vite")}\nUWK_SELFCHECK_VITE_ROOT=${dirname(fileURLToPath(import.meta.resolve("vite/package.json")))}\n`, {flag:"a"});'
      - name: Install browser
        working-directory: packages/unplugin
        run: vp exec playwright install --with-deps chromium
      - name: Exercise packed dev and production worklets
        working-directory: packages/unplugin
        run: vp test run --config vite.integration.config.ts selfcheck.browser -t packed
