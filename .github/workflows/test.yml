name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Lint + Format + Typecheck (= vp check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
      - run: vp install
      - run: vp check

  vitest:
    name: Vitest (= node-side + browser SAB + browser postMessage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
      - run: vp install
      - name: Build packages in dependency order (avoid cycles; vite-plugin → core → lang → offline → test; vp run -r fails on cycle detection)
        run: |
          vp run --filter @unworklet/vite-plugin build
          vp run --filter @unworklet/core build
          vp run --filter @unworklet/lang build
          vp run --filter @unworklet/offline build
          vp run --filter @unworklet/test build
      - name: Install playwright chromium (for browser e2e projects)
        working-directory: examples/01-stereo-gain
        run: vp exec playwright install --with-deps chromium
      - name: Run vitest aggregation
        run: vp test
      - name: Run experiment suites standalone (kept out of the cross-project
          aggregation — `@vitejs/devtools` peer-keys a duplicate vite-plus-test
          runner that breaks the shared collector; each runs as its own root here)
        working-directory: experiments/devtools-proto
        run: vp test run

  e2e:
    name: Playwright e2e (via dev server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
      - run: vp install
      - name: Build packages in dependency order (avoid cycles; vite-plugin → core → lang → offline → test; vp run -r fails on cycle detection)
        run: |
          vp run --filter @unworklet/vite-plugin build
          vp run --filter @unworklet/core build
          vp run --filter @unworklet/lang build
          vp run --filter @unworklet/offline build
          vp run --filter @unworklet/test build
      - name: Install playwright chromium
        working-directory: examples/01-stereo-gain
        run: vp exec playwright install --with-deps chromium
      - name: Run playwright e2e
        run: vp run --filter ./examples/01-stereo-gain test:e2e
