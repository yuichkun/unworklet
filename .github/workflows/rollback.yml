name: Rollback

# Puts a released version's demo back on the production domain, so the demo
# keeps matching npm after `latest` has been moved back. Started by
# scripts/release/rollback.ts; the deployment of each release is recorded on
# its GitHub Release as demo-deployment.txt.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Released version whose demo goes back on the production domain, for example 0.3.0.
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  rollback:
    name: Restore the demo of the given release
    runs-on: ubuntu-latest
    steps:
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
      - name: Find the deployment that release was heard in
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" \
            --pattern demo-deployment.txt --dir "$RUNNER_TEMP"
          echo "url=$(cat "$RUNNER_TEMP/demo-deployment.txt")" >> "$GITHUB_OUTPUT"
      - name: Roll the production domain back to it
        env:
          VERCEL_ORG_ID: team_Us99kzAzcWnEYDgVZhCpFEvE
          VERCEL_PROJECT_ID: prj_nJ6tS4mR7AY3udftZFrVpqDcPnqp
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          URL: ${{ steps.find.outputs.url }}
        run: vp dlx vercel@60.1.3 rollback "$URL" --token "$VERCEL_TOKEN"
      - name: Check that production serves it
        env:
          VERSION: ${{ inputs.version }}
        run: |
          for attempt in $(seq 1 30); do
            served=$(curl -fsS https://unworklet.vercel.app/release.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version' || true)
            if [ "$served" = "$VERSION" ]; then
              echo "Production serves v$VERSION."
              exit 0
            fi
            sleep 10
          done
          echo "::error::https://unworklet.vercel.app does not serve v$VERSION."
          exit 1
