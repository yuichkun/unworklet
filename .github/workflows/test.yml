name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Lint + Format + Typecheck (= vp check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
      - run: vp install
      - run: vp check
      - name: Verify lang coverage artifact safeguards
        run: vp exec node --test scripts/coverage-shards/*.test.mjs

  vitest:
    name: Vitest (= node-side + browser SAB + browser postMessage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
      - run: vp install
      - name: Build packages in dependency order (avoid cycles; unplugin → core → lang → offline → test; vp run -r fails on cycle detection)
        run: |
          vp run --filter @unworklet/unplugin build
          vp run --filter @unworklet/core build
          vp run --filter @unworklet/lang build
          vp run --filter @unworklet/offline build
          vp run --filter @unworklet/test build
      - name: Install playwright chromium (for browser e2e projects)
        working-directory: examples/demo
        run: vp exec playwright install --with-deps chromium
      - name: Run vitest aggregation
        run: vp test
      - name: Run the demo as a standalone consumer app
        working-directory: examples/demo
        run: vp test run

  coverage:
    name: Branch coverage (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.package == 'lang' && 90 || 45 }}
    strategy:
      fail-fast: false
      matrix:
        package: [core, lang, offline, test, unplugin]
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
      - run: vp install
      - run: vp run build
      - name: Discover the full lang test inventory
        if: matrix.package == 'lang'
        working-directory: packages/lang
        run: vp test list --filesOnly --json=expected-tests.json
      - name: Measure package branches and enforce its threshold
        working-directory: packages/${{ matrix.package }}
        env:
          UWK_DISTS_BUILT: "1"
        run: |
          if [ "${{ matrix.package }}" = "lang" ]; then
            vp test run --coverage --maxWorkers=2 \
              --reporter=default --reporter=blob --reporter=json \
              --outputFile.blob=coverage-reference/blob.json \
              --outputFile.json=coverage-reference/tests.json \
              --coverage.reporter=text --coverage.reporter=html \
              --coverage.reporter=json-summary --coverage.reporter=json
          else
            vp test run --coverage --maxWorkers=2
          fi
      - name: Seal successful unsharded lang evidence
        if: matrix.package == 'lang'
        env:
          COVERAGE_SHARD: "0"
        run: |
          mkdir packages/lang/coverage-reference/coverage
          cp packages/lang/coverage/coverage-final.json packages/lang/coverage/coverage-summary.json packages/lang/coverage-reference/coverage/
          vp exec node scripts/coverage-shards/verify.mjs record packages/lang/coverage-reference packages/lang/expected-tests.json
      - uses: actions/upload-artifact@v4
        if: matrix.package == 'lang'
        with:
          name: lang-coverage-${{ github.run_id }}-${{ github.run_attempt }}-reference
          path: packages/lang/coverage-reference
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.package }}
          path: packages/${{ matrix.package }}/coverage

  lang-coverage-shards:
    name: Lang coverage candidate (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
      - run: vp install --frozen-lockfile
      - run: vp run build
      - name: Discover the full lang test inventory
        working-directory: packages/lang
        run: vp test list --filesOnly --json=expected-tests.json
      - name: Measure a partial lang shard
        working-directory: packages/lang
        env:
          UWK_DISTS_BUILT: "1"
          COVERAGE_SHARD: ${{ matrix.shard }}
        # Only the complete native merge may decide the package's 98% gate.
        run: |
          vp test run --coverage --maxWorkers=2 --shard="${COVERAGE_SHARD}/2" \
            --reporter=default --reporter=blob --reporter=json \
            --outputFile.blob=coverage-shard/blob.json \
            --outputFile.json=coverage-shard/tests.json \
            --coverage.reportsDirectory=coverage-shard/coverage \
            --coverage.reporter=json-summary --coverage.reporter=json \
            --coverage.thresholds.branches=0
      - name: Seal successful shard evidence
        env:
          COVERAGE_SHARD: ${{ matrix.shard }}
        run: vp exec node scripts/coverage-shards/verify.mjs record packages/lang/coverage-shard packages/lang/expected-tests.json
      - uses: actions/upload-artifact@v4
        with:
          name: lang-coverage-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}-of-2
          path: packages/lang/coverage-shard
          if-no-files-found: error

  lang-coverage-equivalence:
    name: Lang coverage shard equivalence (candidate)
    needs: [coverage, lang-coverage-shards]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Reject unsuccessful or cancelled producers
        env:
          REFERENCE_RESULT: ${{ needs.coverage.result }}
          SHARDS_RESULT: ${{ needs.lang-coverage-shards.result }}
        run: test "$REFERENCE_RESULT" = success && test "$SHARDS_RESULT" = success
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
      - run: vp install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: lang-coverage-${{ github.run_id }}-${{ github.run_attempt }}-reference
          path: lang-coverage-inputs/reference
      - uses: actions/download-artifact@v4
        with:
          name: lang-coverage-${{ github.run_id }}-${{ github.run_attempt }}-1-of-2
          path: lang-coverage-inputs/shard-1
      - uses: actions/download-artifact@v4
        with:
          name: lang-coverage-${{ github.run_id }}-${{ github.run_attempt }}-2-of-2
          path: lang-coverage-inputs/shard-2
      - name: Discover the full lang test inventory
        working-directory: packages/lang
        run: vp test list --filesOnly --json=expected-tests.json
      - name: Verify complete same-attempt evidence before native merge
        run: vp exec node scripts/coverage-shards/verify.mjs prepare lang-coverage-inputs packages/lang/expected-tests.json
      - name: Merge with the unchanged native V8 98% package policy
        working-directory: packages/lang
        run: |
          vp test run --merge-reports=merge-blobs --coverage \
            --reporter=default --reporter=json --outputFile.json=coverage/merged-tests.json \
            --coverage.reporter=text --coverage.reporter=html \
            --coverage.reporter=json-summary --coverage.reporter=json
      - name: Verify merged branch identities and complete test multiset
        run: vp exec node scripts/coverage-shards/verify.mjs compare lang-coverage-inputs packages/lang/expected-tests.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lang-coverage-candidate-${{ github.run_id }}-${{ github.run_attempt }}-merged
          path: packages/lang/coverage
          if-no-files-found: warn

  devtools-coverage:
    name: Branch coverage (DevTools UI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
      - run: vp install
      - run: vp run build
      - name: Measure all DevTools TypeScript and Vue branches
        working-directory: packages/unplugin/devtools-ui
        run: vp test run --coverage --maxWorkers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-devtools-ui
          path: packages/unplugin/devtools-ui/coverage

  e2e:
    name: Playwright e2e (via dev server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
      - run: vp install
      - name: Build packages in dependency order (avoid cycles; unplugin → core → lang → offline → test; vp run -r fails on cycle detection)
        run: |
          vp run --filter @unworklet/unplugin build
          vp run --filter @unworklet/core build
          vp run --filter @unworklet/lang build
          vp run --filter @unworklet/offline build
          vp run --filter @unworklet/test build
      - name: Install playwright chromium
        working-directory: examples/demo
        run: vp exec playwright install --with-deps chromium
      - name: Run the demo runtime-compile browser e2e
        working-directory: examples/demo
        run: vp test run --config vite.browser.config.ts
      - name: Retain playground layout screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playground-layout-chromium
          path: examples/demo/src/**/__screenshots__/**
          if-no-files-found: warn
          retention-days: 14

  packaging:
    name: Packaging (publint + arethetypeswrong)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
      - run: vp install
      - name: Build packages in dependency order (unplugin → core → lang → offline → test)
        run: |
          vp run --filter @unworklet/unplugin build
          vp run --filter @unworklet/core build
          vp run --filter @unworklet/lang build
          vp run --filter @unworklet/offline build
          vp run --filter @unworklet/test build
      - name: publint + attw on each packed tarball
        # Verifies the PUBLISHED surface (publishConfig.exports → dist/.d.mts/.mjs),
        # the path source tests never exercise (they resolve the `development` →
        # src condition). `fallback-condition` is the known TS50762 quirk for an
        # ESM-only package carrying both a dev (src) and publish (dist) export
        # condition — types still resolve, so it is ignored; real breaks (a missing
        # dist target, a broken .d.mts, an unresolved subpath) still fail the gate.
        run: |
          set -e
          packed_dir="$(mktemp -d)"
          for p in core lang offline test unplugin; do
            echo "::group::@unworklet/$p"
            # lang's ./typescript-plugin export is a tsserver plugin (referenced by
            # name in tsconfig `plugins`, never type-imported), so it intentionally
            # ships no .d.ts → ignore attw's untyped-resolution for lang only.
            ignore=(fallback-condition)
            if [ "$p" = "lang" ]; then ignore=(fallback-condition untyped-resolution); fi
            ( cd "packages/$p" && vp pm pack --pack-destination "$packed_dir" )
            vp dlx -- publint "$packed_dir/unworklet-$p-"*.tgz --strict
            vp dlx -- @arethetypeswrong/cli "$packed_dir/unworklet-$p-"*.tgz --profile esm-only --ignore-rules "${ignore[@]}"
            echo "::endgroup::"
          done
