name: Release

# A release is a pull request from a `release/vX.Y.Z` branch that sets the five
# package versions to X.Y.Z and adds the CHANGELOG section. Its title and
# description become the GitHub Release. Its Vercel preview is where the release
# is listened to. Merging it publishes the commit the merge creates on main,
# which must have exactly the files of the pull request's last commit, the one
# that preview was built from: to npm, as the vX.Y.Z tag and GitHub Release, and
# to the `production` branch, which Vercel deploys as the production demo. See
# RELEASE.md.

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    name: Publish the merged release
    if: github.event.pull_request.merged && startsWith(github.event.pull_request.head.ref, 'release/v')
    # Release runs never overlap. GitHub keeps only one run waiting and cancels
    # an older waiting one; a canceled run can be rerun later, because a run for
    # a version older than the newest release moves nothing back.
    concurrency:
      group: release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      # The commit the merge created on main. npm's provenance names this commit,
      # so it is the one that is built, published and tagged.
      SHA: ${{ github.sha }}
      LISTENED: ${{ github.event.pull_request.head.sha }}
      BRANCH: ${{ github.event.pull_request.head.ref }}
      TITLE: ${{ github.event.pull_request.title }}
      NOTES: ${{ github.event.pull_request.body }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
      - run: vp install
      - name: Check that this is the listened-to release
        run: |
          git fetch --depth 1 origin "$LISTENED"
          if [ "$(git rev-parse "$SHA^{tree}")" != "$(git rev-parse "$LISTENED^{tree}")" ]; then
            echo "::error::main differs from the pull request's last commit, so this is not what was listened to. See RELEASE.md."
            exit 1
          fi
          version="${BRANCH#release/v}"
          for p in core lang offline test unplugin; do
            actual=$(node -p "require('./packages/$p/package.json').version")
            if [ "$actual" != "$version" ]; then
              echo "::error::packages/$p is at $actual, but $BRANCH releases $version."
              exit 1
            fi
          done
          tagged=$(git ls-remote --tags origin "refs/tags/v$version" | cut -f1)
          if [ -n "$tagged" ] && [ "$tagged" != "$SHA" ]; then
            echo "::error::v$version was already released from $tagged."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Check whether this is the newest release
        run: |
          current=0.0.0
          if git fetch --depth 1 origin production 2> /dev/null; then
            current=$(git show FETCH_HEAD:packages/core/package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')
          fi
          if [ "$(printf '%s\n%s\n' "$current" "$VERSION" | sort -V | tail -1)" = "$VERSION" ]; then
            echo "NEWEST=true" >> "$GITHUB_ENV"
            echo "NPM_TAG=latest" >> "$GITHUB_ENV"
          else
            echo "::notice::production is at $current, newer than $VERSION: $VERSION goes to npm under the previous tag, and npm's latest, production and the latest release stay."
            echo "NEWEST=false" >> "$GITHUB_ENV"
            echo "NPM_TAG=previous" >> "$GITHUB_ENV"
          fi
      - run: vp run build
      # Trusted publishing: npm checks that this workflow is publishing, so no
      # token is stored. Versions npm already has are skipped, so a rerun is safe.
      - name: Publish to npm
        run: vp pm publish -r --access public --no-git-checks --tag "$NPM_TAG"
      - name: Tag the release and create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git ls-remote --tags origin "refs/tags/v$VERSION")" ]; then
            git tag "v$VERSION" "$SHA"
            git push origin "v$VERSION"
          fi
          if ! gh release view "v$VERSION" > /dev/null 2>&1; then
            printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.md"
            gh release create "v$VERSION" --verify-tag --latest="$NEWEST" --title "$TITLE" --notes-file "$RUNNER_TEMP/notes.md"
          fi
      - name: Move the production demo to this release
        if: env.NEWEST == 'true'
        run: git push --force origin "$SHA:refs/heads/production"
