name: Lang coordinator lifecycle proof
on:
  push:
    branches: [validation/lang-gate-coordinator-145]
concurrency:
  group: lang-gate-coordinator-${{ github.ref }}
  cancel-in-progress: true
env:
  PROBE_SCENARIO: timeout
jobs:
  shards:
    name: Tiny shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Produce shard witness
        shell: bash
        env:
          SLOT: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          if [[ "$SLOT" == 4 ]]; then
            case "$PROBE_SCENARIO" in
              failure) exit 1 ;;
              timeout) sleep 180 ;;
              cancel-before-owner) echo 'WAITING_BEFORE_OWNER'; sleep 90 ;;
            esac
          fi
          mkdir witness
          printf '%s\n' "$GITHUB_SHA $GITHUB_RUN_ID $GITHUB_RUN_ATTEMPT $SLOT" > "witness/$SLOT.txt"
      - name: Upload shard witness
        if: ${{ success() && !(env.PROBE_SCENARIO == 'missing-artifact' && matrix.shard == 4) }}
        uses: actions/upload-artifact@v4
        with:
          name: gate-proof-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: witness
          if-no-files-found: error
          retention-days: 1
  coverage:
    name: Branch coverage (lang)
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      actions: read
      contents: read
    steps:
      - name: Wait for exact current-attempt producers
        id: producers
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import json, os, time, urllib.request
          names = {f"Tiny shard {i}" for i in range(1, 5)}
          endpoint = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}/attempts/{os.environ['GITHUB_RUN_ATTEMPT']}/jobs?per_page=100"
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, message, headers, newurl):
                  raise RuntimeError('Unexpected API redirect')
          opener = urllib.request.build_opener(NoRedirect)
          deadline = time.monotonic() + 150
          observed = {}
          delay = 3
          while True:
              request = urllib.request.Request(endpoint, headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"})
              with opener.open(request, timeout=15) as response:
                  data = json.load(response)
              if data['total_count'] > 100:
                  raise RuntimeError('Unexpected unpaginated job inventory')
              candidates = [job for job in data['jobs'] if job['name'].startswith('Tiny shard ')]
              if any(job['name'] not in names for job in candidates):
                  raise RuntimeError('Unexpected shard identity')
              jobs = candidates
              if len({job['name'] for job in jobs}) != len(jobs):
                  raise RuntimeError('Duplicate shard identity')
              for job in jobs:
                  if observed.setdefault(job['name'], job['id']) != job['id']:
                      raise RuntimeError('Shard job ID changed during the attempt')
                  if str(job['run_id']) != os.environ['GITHUB_RUN_ID'] or str(job['run_attempt']) != os.environ['GITHUB_RUN_ATTEMPT'] or job['head_sha'] != os.environ['GITHUB_SHA']:
                      raise RuntimeError('Wrong run/attempt/source identity')
                  if job['status'] == 'completed' and job['conclusion'] != 'success':
                      raise RuntimeError(f"Shard did not succeed: {job['name']} {job['conclusion']}")
              if len(jobs) == 4 and all(job['status'] == 'completed' and job['conclusion'] == 'success' for job in jobs):
                  break
              if time.monotonic() >= deadline:
                  raise RuntimeError('Timed out waiting for complete shard success')
              time.sleep(delay)
              delay = min(10, delay + 1)
          PYCODE
      - name: Download current-run witnesses
        id: download
        uses: actions/download-artifact@v4
        with:
          pattern: gate-proof-${{ github.run_id }}-${{ github.run_attempt }}-*
          merge-multiple: true
          path: witnesses
      - name: Validate exact artifact inventory
        id: inventory
        shell: bash
        run: |
          set -euo pipefail
          test "$(find witnesses -type f | wc -l)" -eq 4
          for slot in 1 2 3 4; do
            test "$(cat "witnesses/$slot.txt")" = "$GITHUB_SHA $GITHUB_RUN_ID $GITHUB_RUN_ATTEMPT $slot"
          done
      - name: Simulate native merge
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$PROBE_SCENARIO" == cancel-during-merge ]]; then
            echo 'WAITING_DURING_MERGE'
            sleep 90
          fi
          printf 'native merge completed\n' > merge-success
      - name: Pause after merge for cancellation proof
        id: after_merge
        shell: bash
        run: |
          set -euo pipefail
          test -f merge-success
          if [[ "$PROBE_SCENARIO" == cancel-after-merge ]]; then
            echo 'WAITING_AFTER_MERGE'
            sleep 90
          fi
      - name: Final fail-closed verdict
        env:
          PRODUCERS: ${{ steps.producers.outcome }}
          DOWNLOAD: ${{ steps.download.outcome }}
          INVENTORY: ${{ steps.inventory.outcome }}
          MERGE: ${{ steps.merge.outcome }}
          AFTER_MERGE: ${{ steps.after_merge.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'producers=%s download=%s inventory=%s merge=%s after_merge=%s\n' "$PRODUCERS" "$DOWNLOAD" "$INVENTORY" "$MERGE" "$AFTER_MERGE"
          for result in "$PRODUCERS" "$DOWNLOAD" "$INVENTORY" "$MERGE" "$AFTER_MERGE"; do
            test "$result" = success
          done
          test -f merge-success
