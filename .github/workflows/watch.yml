name: Release watch

# Once a day, checks from outside that the production demo, npm and the latest
# GitHub Release agree on the latest release, and keeps one open issue
# describing any disagreement until it is resolved.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    name: Production demo, npm and releases agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
      - run: vp install
      - name: Compare the production demo, npm and the latest release
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: vp exec node scripts/release/watch.ts "$RUNNER_TEMP/watch-report.md"
      # A check that could not read one of the three fails the run without an issue.
      - name: Open the issue, or add to it when the disagreement changes
        if: failure() && steps.check.outputs.disagree == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="The production demo, npm and the latest release disagree"
          report="$RUNNER_TEMP/watch-report.md"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            gh issue create --title "$title" --body-file "$report"
          elif [ "$(gh issue view "$number" --json body,comments --jq '(.comments | last | .body) // .body')" != "$(cat "$report")" ]; then
            gh issue comment "$number" --body-file "$report"
          fi
      - name: Close the issue once they agree
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="The production demo, npm and the latest release disagree"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue close "$number" --comment "They agree again: $(cat "$RUNNER_TEMP/watch-report.md")"
          fi
