name: Release

# One run carries a release from the pending changesets to npm and the
# production demo. The candidate is built once; after the `release`
# environment's reviewer has listened to it and approved, the same tarballs are
# published and the same demo deployment is promoted. Rejecting leaves npm,
# main and the production demo untouched.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare the release commit
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.commit.outputs.sha }}
      pr: ${{ steps.pr.outputs.number }}
    steps:
      - name: Require a reviewer on the release environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          reviewers=$(gh api "repos/$GITHUB_REPOSITORY/environments/release" \
            --jq '[.protection_rules[] | select(.type == "required_reviewers") | .reviewers | length] | add // 0' || echo 0)
          if [ "$reviewers" -eq 0 ]; then
            echo "::error::The release environment has no required reviewer, so nothing would stop an unheard candidate from being published. Add one in Settings → Environments → release."
            exit 1
          fi
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          # Pushes made with the workflow's own token start no workflows, so the
          # release branch is pushed with the App's token to get its checks.
          token: ${{ steps.app.outputs.token }}
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
      - run: vp install
      - name: Derive the version and changelog from the changesets
        id: version
        run: vp exec node scripts/release/version.ts
      - name: Refuse a version npm already has
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if curl -fsS "https://registry.npmjs.org/@unworklet/core/$VERSION" > /dev/null 2>&1; then
            echo "::error::v$VERSION is already on npm, but main does not have its release commit. Rerun the promote job of the run that published it, so that its release pull request merges, then start the next release."
            exit 1
          fi
      - name: Commit to the release branch
        id: commit
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "release/v$VERSION"
          git add CHANGELOG.md packages/*/package.json .changeset
          git commit -m "release: v$VERSION"
          git push --force origin "release/v$VERSION"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Open or update the release pull request
        id: pr
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
          NOTES: ${{ steps.version.outputs.notes }}
        run: |
          number=$(gh pr list --head "release/v$VERSION" --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh pr edit "$number" --body-file "$NOTES"
          else
            gh pr create --base main --head "release/v$VERSION" --title "Release v$VERSION" --body-file "$NOTES"
            number=$(gh pr list --head "release/v$VERSION" --state open --json number --jq '.[0].number')
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
          gh pr list --state open --json number,headRefName \
            --jq ".[] | select(.headRefName | startswith(\"release/v\")) | select(.headRefName != \"release/v$VERSION\") | .number" |
            while read -r stale; do
              gh pr close "$stale" --delete-branch --comment "Superseded by release/v$VERSION."
            done
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: ${{ steps.version.outputs.notes }}
          if-no-files-found: error

  test:
    name: Test the release commit
    needs: prepare
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  candidate:
    name: Build and deploy the candidate
    needs: prepare
    uses: ./.github/workflows/candidate.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      deploy: true
      compare-with: release
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

  soak:
    name: Soak both transports for 30 minutes each
    # Shown next to the approval rather than required by it: whether GitHub's
    # runners, which have no audio device, can hold a live AudioContext for the
    # full duration is established by the first release run.
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
      - run: vp install
      - run: vp run build
      - name: Install Chromium
        working-directory: examples/demo
        run: vp exec playwright install --with-deps chromium
      - name: Run the release soak
        run: vp exec node scripts/release-soak/run.mjs --seconds 1800 --out "$RUNNER_TEMP/soak"
      - name: Summarize the soak
        if: always()
        run: |
          {
            echo "## Release soak"
            echo
            for file in "$RUNNER_TEMP"/soak/*.json; do
              echo "$(basename "$file")"
              echo
              echo '```json'
              head -c 6000 "$file"
              echo
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-soak
          path: ${{ runner.temp }}/soak

  publish:
    name: Publish the listened-to tarballs to npm
    needs: [prepare, test, candidate]
    runs-on: ubuntu-latest
    environment:
      name: release
      url: ${{ needs.candidate.outputs.url }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
      - run: vp install
      - uses: actions/download-artifact@v4
        with:
          name: release-tarballs
          path: ${{ runner.temp }}/tarballs
      - name: Publish layer by layer and wait for npm to serve each one
        run: vp exec node scripts/release/publish.ts "$RUNNER_TEMP/tarballs"
      - name: Install the release from npm into an empty project
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          dir=$(mktemp -d)
          cd "$dir"
          node -e '
            const { packageManager } = require(process.env.GITHUB_WORKSPACE + "/package.json");
            const packages = ["core", "lang", "offline", "test", "unplugin"];
            const dependencies = Object.fromEntries(packages.map((p) => [`@unworklet/${p}`, process.env.VERSION]));
            require("fs").writeFileSync("package.json", JSON.stringify({ private: true, type: "module", packageManager, dependencies }));
          '
          vp install
          node --input-type=module -e 'await import("@unworklet/core"); await import("@unworklet/offline"); console.log("The release installs from npm.");'

  promote:
    name: Promote the demo and tag the release
    needs: [prepare, candidate, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: read
    steps:
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: candidate-demo
          path: ${{ runner.temp }}/candidate
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes
      - name: Promote the listened-to deployment to the production domain
        env:
          VERCEL_ORG_ID: team_Us99kzAzcWnEYDgVZhCpFEvE
          VERCEL_PROJECT_ID: prj_nJ6tS4mR7AY3udftZFrVpqDcPnqp
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          CANDIDATE_URL: ${{ needs.candidate.outputs.url }}
        run: |
          if curl -fsS https://unworklet.vercel.app/ -o served.html &&
            cmp -s served.html "$RUNNER_TEMP/candidate/static/index.html"; then
            echo "Production already serves the candidate."
          else
            vp dlx vercel@60.1.3 promote "$CANDIDATE_URL" --token "$VERCEL_TOKEN"
          fi
      - name: Check that production serves the candidate
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS https://unworklet.vercel.app/ -o served.html &&
              cmp -s served.html "$RUNNER_TEMP/candidate/static/index.html"; then
              echo "Production serves the candidate."
              exit 0
            fi
            sleep 10
          done
          echo "::error::https://unworklet.vercel.app does not serve the promoted candidate."
          exit 1
      - name: Tag the release commit and create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          if [ -z "$(git ls-remote --tags origin "refs/tags/v$VERSION")" ]; then
            git tag "v$VERSION" "$SHA"
            git push origin "v$VERSION"
          fi
          if ! gh release view "v$VERSION" > /dev/null 2>&1; then
            gh release create "v$VERSION" --verify-tag --latest --title "v$VERSION" \
              --notes-file "$RUNNER_TEMP/notes/release-notes.md"
          fi
      - name: Record which deployment is this version's demo
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          CANDIDATE_URL: ${{ needs.candidate.outputs.url }}
        run: |
          echo "$CANDIDATE_URL" > "$RUNNER_TEMP/demo-deployment.txt"
          gh release upload "v$VERSION" "$RUNNER_TEMP/demo-deployment.txt" --clobber
      - name: Merge the release pull request once its checks pass
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR: ${{ needs.prepare.outputs.pr }}
        run: |
          if [ "$(gh pr view "$PR" --json state --jq .state)" = "MERGED" ]; then
            exit 0
          fi
          gh pr update-branch "$PR"
          head=$(gh pr view "$PR" --json headRefOid --jq .headRefOid)
          # A new head has no checks until its workflows start.
          for attempt in $(seq 1 30); do
            if [ "$(gh api "repos/$GITHUB_REPOSITORY/commits/$head/check-runs" --jq .total_count)" -gt 0 ]; then
              break
            fi
            sleep 10
          done
          gh pr checks "$PR" --watch --fail-fast
          gh pr merge "$PR" --merge --match-head-commit "$head"
      - name: Tell the issues this release fixes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          body="Released in [v$VERSION](https://github.com/$GITHUB_REPOSITORY/releases/tag/v$VERSION)."
          previous=$(git describe --tags --abbrev=0 "$SHA^")
          git log --format=%s "$previous..$SHA" |
            sed -nE 's/^Merge pull request #([0-9]+).*/\1/p; s/.*\(#([0-9]+)\)$/\1/p' |
            sort -u |
            while read -r number; do
              # A number in a commit subject can be an issue rather than a pull request.
              gh pr view "$number" --json closingIssuesReferences \
                --jq '.closingIssuesReferences[] | select(.url | startswith("https://github.com/" + env.GITHUB_REPOSITORY + "/issues/")) | .number' \
                2> /dev/null || true
            done |
            sort -u |
            while read -r issue; do
              if gh api "repos/$GITHUB_REPOSITORY/issues/$issue/comments" --paginate --jq '.[].body' | grep -qxF "$body"; then
                continue
              fi
              gh issue comment "$issue" --body "$body"
            done
