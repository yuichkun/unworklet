name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Lint + Format + Typecheck (= vp check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
      - run: vp install
      - run: vp check
      - name: Verify test portfolio ownership
        run: vp exec node --test scripts/test-portfolio/*.test.mjs

  vitest:
    name: Vitest (= node-side + browser SAB + browser postMessage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
      - run: vp install
      - name: Build packages in dependency order (avoid cycles; unplugin → core → lang → offline → test; vp run -r fails on cycle detection)
        run: |
          vp run --filter @unworklet/unplugin build
          vp run --filter @unworklet/core build
          vp run --filter @unworklet/lang build
          vp run --filter @unworklet/offline build
          vp run --filter @unworklet/test build
      - name: Verify complete test ownership
        run: vp exec node scripts/test-portfolio/check.mjs
      - name: Install playwright chromium (for browser e2e projects)
        working-directory: examples/demo
        run: vp exec playwright install --with-deps chromium
      - name: Run browser, integration and repository invariants
        run: vp test run --config vite.ci.config.ts
      - name: Run the demo as a standalone consumer app
        working-directory: examples/demo
        run: vp test run

  coverage:
    name: Branch coverage (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.package == 'lang' && 90 || 45 }}
    strategy:
      fail-fast: false
      matrix:
        package: [core, lang, offline, test, unplugin]
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
      - run: vp install
      - run: vp run build
      - name: Record runner resources
        run: |
          nproc
          lscpu | grep -E 'Architecture:|Model name:|CPU MHz:'
          grep -E 'MemTotal|MemAvailable' /proc/meminfo
          cat /proc/self/cgroup
          grep ' - cgroup2 ' /proc/self/mountinfo || true
          group="/sys/fs/cgroup$(awk -F: '$1 == "0" { print $3 }' /proc/self/cgroup)"
          while [ -d "$group" ]; do
            echo "cgroup: $group"
            for field in cpu.max cpuset.cpus.effective memory.max memory.current memory.peak memory.events; do
              printf '%s: ' "$field"
              cat "$group/$field" 2>/dev/null || echo unavailable
            done
            [ "$group" = /sys/fs/cgroup ] && break
            group="$(dirname "$group")"
          done
      - name: Measure package branches and enforce its threshold
        working-directory: packages/${{ matrix.package }}
        env:
          UWK_DISTS_BUILT: "1"
        run: |
          /usr/bin/time -v vp test run --coverage --maxWorkers=2 \
            --reporter=default --reporter=json --outputFile.json=coverage/tests.json \
            --coverage.reporter=text --coverage.reporter=html \
            --coverage.reporter=json-summary --coverage.reporter=json
      - name: Record peak runner memory
        if: always()
        run: |
          grep -E 'MemTotal|MemAvailable' /proc/meminfo
          group="/sys/fs/cgroup$(awk -F: '$1 == "0" { print $3 }' /proc/self/cgroup)"
          if [ ! -d "$group" ]; then echo "Process cgroup memory accounting unavailable"; fi
          while [ -d "$group" ]; do
            echo "cgroup: $group"
            for field in memory.current memory.peak memory.events; do
              printf '%s: ' "$field"
              cat "$group/$field" 2>/dev/null || echo unavailable
            done
            [ "$group" = /sys/fs/cgroup ] && break
            group="$(dirname "$group")"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.package }}
          path: packages/${{ matrix.package }}/coverage

  devtools-coverage:
    name: Branch coverage (DevTools UI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
      - run: vp install
      - run: vp run build
      - name: Measure all DevTools TypeScript and Vue branches
        working-directory: packages/unplugin/devtools-ui
        run: vp test run --coverage --maxWorkers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-devtools-ui
          path: packages/unplugin/devtools-ui/coverage

  e2e:
    name: Playwright e2e (via dev server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
      - run: vp install
      - name: Build packages in dependency order (avoid cycles; unplugin → core → lang → offline → test; vp run -r fails on cycle detection)
        run: |
          vp run --filter @unworklet/unplugin build
          vp run --filter @unworklet/core build
          vp run --filter @unworklet/lang build
          vp run --filter @unworklet/offline build
          vp run --filter @unworklet/test build
      - name: Install playwright chromium
        working-directory: examples/demo
        run: vp exec playwright install --with-deps chromium
      - name: Run the demo runtime-compile browser e2e
        working-directory: examples/demo
        run: vp test run --config vite.browser.config.ts
      - name: Retain playground layout screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playground-layout-chromium
          path: examples/demo/src/**/__screenshots__/**
          if-no-files-found: warn
          retention-days: 14

  packaging:
    name: Packaging (publint + arethetypeswrong)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
      - run: vp install
      - name: Build packages in dependency order (unplugin → core → lang → offline → test)
        run: |
          vp run --filter @unworklet/unplugin build
          vp run --filter @unworklet/core build
          vp run --filter @unworklet/lang build
          vp run --filter @unworklet/offline build
          vp run --filter @unworklet/test build
      - name: publint + attw on each packed tarball
        # Verifies the PUBLISHED surface (publishConfig.exports → dist/.d.mts/.mjs),
        # the path source tests never exercise (they resolve the `development` →
        # src condition). `fallback-condition` is the known TS50762 quirk for an
        # ESM-only package carrying both a dev (src) and publish (dist) export
        # condition — types still resolve, so it is ignored; real breaks (a missing
        # dist target, a broken .d.mts, an unresolved subpath) still fail the gate.
        run: |
          set -e
          packed_dir="$(mktemp -d)"
          for p in core lang offline test unplugin; do
            echo "::group::@unworklet/$p"
            # lang's ./typescript-plugin export is a tsserver plugin (referenced by
            # name in tsconfig `plugins`, never type-imported), so it intentionally
            # ships no .d.ts → ignore attw's untyped-resolution for lang only.
            ignore=(fallback-condition)
            if [ "$p" = "lang" ]; then ignore=(fallback-condition untyped-resolution); fi
            ( cd "packages/$p" && vp pm pack --pack-destination "$packed_dir" )
            vp dlx -- publint "$packed_dir/unworklet-$p-"*.tgz --strict
            vp dlx -- @arethetypeswrong/cli "$packed_dir/unworklet-$p-"*.tgz --profile esm-only --ignore-rules "${ignore[@]}"
            echo "::endgroup::"
          done
