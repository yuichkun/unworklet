<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>unworklet — stereo gain (Phase 6 A-5 smoke)</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 480px;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      button {
        font-size: 1rem;
        padding: 0.5rem 1rem;
        margin-right: 0.5rem;
      }
      .gain {
        margin-top: 1rem;
      }
      .gain input {
        width: 100%;
      }
      .status {
        margin-top: 1rem;
        font-family: ui-monospace, monospace;
        font-size: 0.85rem;
        color: #555;
      }
    </style>
  </head>
  <body>
    <h1>unworklet stereo gain</h1>
    <p>
      Phase 6 A-5 smoke: 440 Hz / 880 Hz sine pair routed through the WASM-compiled stereo gain
      processor.
    </p>
    <button id="start">start</button>
    <button id="stop" disabled>stop</button>
    <div class="gain">
      <label for="gain">gain <span id="gainval">1.00</span></label>
      <input id="gain" type="range" min="0" max="2" step="0.01" value="1" />
    </div>
    <div class="status" id="status">idle.</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
