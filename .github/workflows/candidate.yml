name: Candidate

# Builds a release candidate the way it ships: the five package tarballs are
# packed once, and the demo is built outside the monorepo with every
# @unworklet package installed from those tarballs. Pull requests build it to
# keep that path working and to report which examples sound different; the
# release workflow also deploys it for listening.

on:
  workflow_call:
    inputs:
      ref:
        description: Commit to build the candidate from.
        type: string
        required: true
      deploy:
        description: Upload the candidate demo to Vercel as a production deployment, without assigning the production domain.
        type: boolean
        default: false
      compare-with:
        description: What to compare the examples' sound with — `release` (the latest version on npm), a commit, or empty to skip.
        type: string
        default: ""
      pull-request:
        description: Pull request to comment on when the examples sound different.
        type: string
        default: ""
    secrets:
      VERCEL_TOKEN:
        required: false
    outputs:
      url:
        description: URL of the deployed candidate demo.
        value: ${{ jobs.candidate.outputs.url }}

jobs:
  candidate:
    name: Release candidate (tarballs and the demo built from them)
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
      - run: vp install
      - run: vp run build
      - name: Pack the release tarballs
        run: vp exec node scripts/release/tarballs.ts "$RUNNER_TEMP/tarballs"
      - name: Build the demo from the tarballs, outside the monorepo
        run: vp exec node scripts/release/demo.ts "$RUNNER_TEMP/tarballs" "$RUNNER_TEMP/candidate"
      - name: Check that both compile paths produce the same WASM
        working-directory: ${{ runner.temp }}/candidate/demo
        run: vp exec node src/compile-paths.ts dist

      - name: Download the current release from npm
        id: previous
        if: inputs.compare-with == 'release'
        run: vp exec node scripts/release/fetch-release.ts latest "$RUNNER_TEMP/tarballs" "$RUNNER_TEMP/before-tarballs"
      - name: Check out the commit to compare with
        if: inputs.compare-with != '' && inputs.compare-with != 'release'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.compare-with }}
          path: base
      - name: Pack the tarballs of the commit to compare with
        if: inputs.compare-with != '' && inputs.compare-with != 'release'
        working-directory: base
        run: |
          vp install
          vp run build
          vp exec node ../scripts/release/tarballs.ts "$RUNNER_TEMP/before-tarballs"
      - name: Render the examples with both versions
        if: inputs.compare-with != ''
        run: |
          vp exec node scripts/release/demo.ts "$RUNNER_TEMP/before-tarballs" "$RUNNER_TEMP/before" --install-only
          (cd "$RUNNER_TEMP/before/demo" && vp exec node src/render-examples.ts "$RUNNER_TEMP/renders/before")
          (cd "$RUNNER_TEMP/candidate/demo" && vp exec node src/render-examples.ts "$RUNNER_TEMP/renders/after")
      - name: Compare how the examples sound
        id: sound
        if: inputs.compare-with != ''
        env:
          COMPARE_WITH: ${{ inputs.compare-with }}
          PREVIOUS: ${{ steps.previous.outputs.version }}
        run: |
          version=$(node -p 'require(process.env.RUNNER_TEMP + "/tarballs/tarballs.json")[0].version')
          if [ "$COMPARE_WITH" = "release" ]; then
            before="v$PREVIOUS (current release)"
            after="v$version (candidate)"
          else
            before="the base commit (${COMPARE_WITH:0:7})"
            after="this pull request"
          fi
          echo "before=$before" >> "$GITHUB_OUTPUT"
          echo "after=$after" >> "$GITHUB_OUTPUT"
          vp exec node scripts/release/sound-diff.ts "$RUNNER_TEMP/renders/before" "$RUNNER_TEMP/renders/after" \
            "$before" "$after" "$RUNNER_TEMP/sound-report.md"
      - name: Comment on the pull request when examples sound different
        if: inputs.pull-request != '' && inputs.compare-with != ''
        env:
          GH_TOKEN: ${{ github.token }}
          MOVED: ${{ steps.sound.outputs.moved }}
          PR: ${{ inputs.pull-request }}
        run: |
          marker="<!-- unworklet-sound-diff -->"
          existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | tail -n 1)
          if [ "$MOVED" = "0" ] && [ -z "$existing" ]; then
            exit 0
          fi
          body="$marker"$'\n'"$(cat "$RUNNER_TEMP/sound-report.md")"
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -f body="$body" > /dev/null
          else
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$body"
          fi

      - name: Compare the public API
        if: inputs.compare-with != ''
        env:
          COMPARE_WITH: ${{ inputs.compare-with }}
          BEFORE: ${{ steps.sound.outputs.before }}
          AFTER: ${{ steps.sound.outputs.after }}
        run: |
          set -- "$RUNNER_TEMP/before-tarballs" "$RUNNER_TEMP/tarballs" "$BEFORE" "$AFTER"
          if [ "$COMPARE_WITH" != "release" ]; then
            set -- "$@" --since "$COMPARE_WITH"
          fi
          vp exec node scripts/release/api-surface.ts "$@"

      - uses: actions/upload-artifact@v4
        if: inputs.deploy
        with:
          name: release-tarballs
          path: ${{ runner.temp }}/tarballs
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: inputs.deploy
        with:
          name: candidate-demo
          path: ${{ runner.temp }}/candidate/.vercel/output
          include-hidden-files: true
          if-no-files-found: error
      - name: Deploy the candidate demo without assigning the production domain
        id: deploy
        if: inputs.deploy
        working-directory: ${{ runner.temp }}/candidate
        env:
          VERCEL_ORG_ID: team_Us99kzAzcWnEYDgVZhCpFEvE
          VERCEL_PROJECT_ID: prj_nJ6tS4mR7AY3udftZFrVpqDcPnqp
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vp dlx vercel@60.1.3 deploy --prebuilt --prod --skip-domain --token "$VERCEL_TOKEN" | tee deploy.log
          url=$(grep -Eo 'https://[^[:space:]]+\.vercel\.app' deploy.log | tail -1)
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Summarize the candidate
        if: inputs.deploy
        env:
          CANDIDATE_URL: ${{ steps.deploy.outputs.url }}
        run: |
          node -e '
            const fs = require("fs");
            const tarballs = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/tarballs/tarballs.json", "utf8"));
            const lines = [
              `## Release candidate v${tarballs[0].version}`,
              "",
              `Tarballs \`${fs.readFileSync(process.env.RUNNER_TEMP + "/candidate/fingerprint", "utf8").trim()}\` — the candidate demo shows the same fingerprint on hover over its version label.`,
              "",
              `- Candidate demo: ${process.env.CANDIDATE_URL} (open it while signed in to Vercel)`,
              "- Current release: https://unworklet.vercel.app",
              "",
              "| Package | Integrity |",
              "| --- | --- |",
              ...tarballs.map((t) => `| \`${t.name}@${t.version}\` | \`${t.integrity}\` |`),
              "",
            ];
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
          '
