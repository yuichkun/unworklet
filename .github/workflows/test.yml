name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Lint + Format + Typecheck (= vp check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
      - run: vp install
      - run: vp check

  vitest:
    name: Vitest (= node-side + browser SAB + browser postMessage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
      - run: vp install
      - name: Build packages in dependency order (avoid cycles; unplugin → core → lang → offline → test; vp run -r fails on cycle detection)
        run: |
          vp run --filter @unworklet/unplugin build
          vp run --filter @unworklet/core build
          vp run --filter @unworklet/lang build
          vp run --filter @unworklet/offline build
          vp run --filter @unworklet/test build
      - name: Install playwright chromium (for browser e2e projects)
        working-directory: examples/demo
        run: vp exec playwright install --with-deps chromium
      - name: Run vitest aggregation
        run: vp test
      - name: Run the demo suite standalone (kept out of the aggregation — its
          `@vitejs/devtools` dep peer-keys a duplicate vite-plus-test runner that
          breaks the shared collector; it runs as its own root here)
        working-directory: examples/demo
        run: vp test run

  e2e:
    name: Playwright e2e (via dev server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
      - run: vp install
      - name: Build packages in dependency order (avoid cycles; unplugin → core → lang → offline → test; vp run -r fails on cycle detection)
        run: |
          vp run --filter @unworklet/unplugin build
          vp run --filter @unworklet/core build
          vp run --filter @unworklet/lang build
          vp run --filter @unworklet/offline build
          vp run --filter @unworklet/test build
      - name: Install playwright chromium
        working-directory: examples/demo
        run: vp exec playwright install --with-deps chromium
      - name: Run the demo runtime-compile browser e2e
        working-directory: examples/demo
        run: vp test run --config vite.browser.config.ts
