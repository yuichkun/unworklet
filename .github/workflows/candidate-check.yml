name: Candidate check

# Builds the release candidate for every pull request and for main, so the
# path a release takes stays working between releases.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  candidate:
    name: Release candidate
    uses: ./.github/workflows/candidate.yml
    with:
      ref: ${{ github.sha }}
