packages:
  - "packages/**"
  - "examples/*"
  - "!**/node_modules/**"

catalogMode: prefer

catalog:
  "@types/node": ^24
  typescript: ^5
  vite: npm:@voidzero-dev/vite-plus-core@0.1.24
  vitest: npm:@voidzero-dev/vite-plus-test@^0.1.24
  vite-plus: 0.1.24
  binaryen: ^129.0.0
  "@vitest/coverage-v8": ^4.1.7
  wavefile: ^11.0.0
  tsx: ^4.22.3
  "@vitejs/devtools-kit": 0.3.3
  jszip: ^3.10.1
  playwright: ^1.60.0
  "@vitest/browser": ^4.1.7
  "@vitest/browser-playwright": ^4.1.7
  "@playwright/test": ^1.60.0
  "@vue-flow/core": ^1.48.2
  "@vue-flow/background": ^1.3.2
  "@vue-flow/controls": ^1.1.3
  vue: ^3.5.34
  vue-router: ^4.6.4
  "@vitejs/plugin-vue": ^6.0.7
  esbuild: ^0.28.0
  monaco-editor: ^0.55.1
  "@fontsource-variable/geist": ^5.2.9
  "@fontsource-variable/jetbrains-mono": ^5.2.8
  "@vitejs/devtools": 0.3.3
  "@volar/language-core": 2.4.15
  "@volar/typescript": 2.4.15
  muggle-string: 0.4.1
  unplugin: ^3.0.0
  fast-check: ^4.8.0
overrides:
  vite: "catalog:"
  vitest: "catalog:"
  # Belt-and-suspenders pin to the repo's single vite-plus version. A transitive dep
  # (e.g. a `vite: *` peer) resolving a second vite-plus-core/test duplicates the test
  # runner — two `playwright()` provider types that don't unify (TS2769) and a second
  # collector that hangs the shared aggregation. The catalog `vite`/`vite-plus` entries
  # are pinned to 0.1.24 too, but these direct `@voidzero-dev/*` names are not reachable
  # through those aliases, so pin them here as well.
  "@voidzero-dev/vite-plus-core": "0.1.24"
  "@voidzero-dev/vite-plus-test": "0.1.24"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
allowBuilds:
  esbuild: true
  vue-demi: true
