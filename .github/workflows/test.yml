name: Lang gate lifecycle proof
on:
  push:
    branches: [validation/lang-gate-lifecycle-145]
concurrency:
  group: lang-gate-lifecycle-${{ github.ref }}
  cancel-in-progress: true
env:
  PROBE_SCENARIO: cancel-during-merge
jobs:
  shards:
    name: Tiny shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Produce shard witness
        shell: bash
        env:
          SLOT: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          if [[ "$SLOT" == 4 ]]; then
            case "$PROBE_SCENARIO" in
              failure) exit 1 ;;
              timeout) sleep 180 ;;
              cancel-before-owner) echo 'WAITING_BEFORE_OWNER'; sleep 90 ;;
            esac
          fi
          mkdir witness
          printf '%s\n' "$GITHUB_SHA $GITHUB_RUN_ID $GITHUB_RUN_ATTEMPT $SLOT" > "witness/$SLOT.txt"
      - name: Upload shard witness
        if: ${{ success() && !(env.PROBE_SCENARIO == 'missing-artifact' && matrix.shard == 4) }}
        uses: actions/upload-artifact@v4
        with:
          name: gate-proof-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: witness
          if-no-files-found: error
          retention-days: 1
  coverage:
    name: Branch coverage (lang)
    runs-on: ubuntu-latest
    timeout-minutes: 4
    needs: shards
    if: ${{ always() }}
    steps:
      - name: Require successful producers
        id: producers
        env:
          PRODUCER_RESULT: ${{ needs.shards.result }}
        run: test "$PRODUCER_RESULT" = success
      - name: Download current-run witnesses
        id: download
        uses: actions/download-artifact@v4
        with:
          pattern: gate-proof-${{ github.run_id }}-${{ github.run_attempt }}-*
          merge-multiple: true
          path: witnesses
      - name: Validate exact artifact inventory
        id: inventory
        shell: bash
        run: |
          set -euo pipefail
          test "$(find witnesses -type f | wc -l)" -eq 4
          for slot in 1 2 3 4; do
            test "$(cat "witnesses/$slot.txt")" = "$GITHUB_SHA $GITHUB_RUN_ID $GITHUB_RUN_ATTEMPT $slot"
          done
      - name: Simulate native merge
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$PROBE_SCENARIO" == cancel-during-merge ]]; then
            echo 'WAITING_DURING_MERGE'
            sleep 90
          fi
          printf 'native merge completed\n' > merge-success
      - name: Pause after merge for cancellation proof
        id: after_merge
        shell: bash
        run: |
          set -euo pipefail
          test -f merge-success
          if [[ "$PROBE_SCENARIO" == cancel-after-merge ]]; then
            echo 'WAITING_AFTER_MERGE'
            sleep 90
          fi
      - name: Final fail-closed verdict
        if: ${{ always() }}
        env:
          PRODUCER_RESULT: ${{ needs.shards.result }}
          PRODUCERS: ${{ steps.producers.outcome }}
          DOWNLOAD: ${{ steps.download.outcome }}
          INVENTORY: ${{ steps.inventory.outcome }}
          MERGE: ${{ steps.merge.outcome }}
          AFTER_MERGE: ${{ steps.after_merge.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'producers=%s download=%s inventory=%s merge=%s after_merge=%s\n' "$PRODUCER_RESULT" "$DOWNLOAD" "$INVENTORY" "$MERGE" "$AFTER_MERGE"
          for result in "$PRODUCER_RESULT" "$PRODUCERS" "$DOWNLOAD" "$INVENTORY" "$MERGE" "$AFTER_MERGE"; do
            test "$result" = success
          done
          test -f merge-success
      - name: Reject cancellation after all validation steps
        if: ${{ always() && cancelled() }}
        run: |
          echo 'A cancelled workflow cannot publish a successful required gate.'
          exit 1
