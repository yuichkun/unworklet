<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>unworklet · UW-1 pocket rack</title>
    <style>
      :root {
        color-scheme: light;
        /* Teenage-Engineering-ish: warm near-white, charcoal ink, signature orange,
           OP-1 encoder accents. Kept light so it reads on top of the dark DevTools. */
        --bg: #e7e4dc;
        --panel: #f6f5f1;
        --panel-2: #efede7;
        --ink: #1b1b19;
        --muted: #8d897e;
        --line: #d6d2c7;
        --orange: #fe5000;
        --blue: #2f6db0;
        --green: #4e9a51;
        --yellow: #f2b203;
        --led-off: #cfcabd;
        --radius: 18px;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 28px 16px;
        background: var(--bg);
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
      }

      .mono {
        font-family: ui-monospace, "SF Mono", SFMono-Regular, "JetBrains Mono", Menlo, monospace;
        font-variant-numeric: tabular-nums;
      }

      /* ── device shell ─────────────────────────────────────────────── */
      .device {
        width: 100%;
        max-width: 760px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow:
          0 1px 0 #ffffff inset,
          0 18px 40px -24px rgba(0, 0, 0, 0.45);
        overflow: hidden;
      }

      /* ── header ───────────────────────────────────────────────────── */
      .head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 20px;
        border-bottom: 1px solid var(--line);
        background: linear-gradient(var(--panel), var(--panel-2));
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 9px;
        font-weight: 650;
        letter-spacing: 0.2px;
      }
      .brand .mark {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--orange);
        box-shadow: 0 0 0 3px rgba(254, 80, 0, 0.16);
      }
      .model {
        font-size: 11px;
        letter-spacing: 1.5px;
        color: var(--muted);
        text-transform: uppercase;
      }
      .power {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 10px;
        letter-spacing: 1.4px;
        color: var(--muted);
        text-transform: uppercase;
      }
      .power .led {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--led-off);
      }
      .power.on .led {
        background: var(--orange);
        box-shadow: 0 0 0 3px rgba(254, 80, 0, 0.16);
      }

      /* ── top row: display + knobs ─────────────────────────────────── */
      .top {
        display: grid;
        grid-template-columns: 200px 1fr;
        gap: 22px;
        padding: 22px 20px;
        align-items: center;
      }

      .display {
        background: #16181c;
        border-radius: 12px;
        padding: 14px 16px;
        color: #f4f2ec;
        border: 1px solid #0c0d10;
        box-shadow: 0 2px 14px -8px rgba(0, 0, 0, 0.6) inset;
        min-height: 96px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .display .row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
      }
      .display .big {
        font-size: 30px;
        font-weight: 600;
        letter-spacing: 1px;
        color: var(--orange);
      }
      .display .unit {
        font-size: 11px;
        color: #7f8694;
        letter-spacing: 1px;
      }
      .display .sub {
        font-size: 11px;
        letter-spacing: 1.2px;
        color: #aeb4c0;
        text-transform: uppercase;
      }
      .display .meter {
        height: 4px;
        border-radius: 3px;
        background: #2a2e36;
        overflow: hidden;
      }
      .display .meter > i {
        display: block;
        height: 100%;
        width: 6%;
        background: var(--orange);
        transition: width 0.08s linear;
      }

      .knobs {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 10px;
      }
      .knob {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 7px;
        user-select: none;
      }
      .dial {
        --accent: var(--muted);
        position: relative;
        width: 54px;
        height: 54px;
        border-radius: 50%;
        background: radial-gradient(circle at 50% 38%, #ffffff, #e9e6df);
        border: 2px solid var(--accent);
        box-shadow: 0 4px 10px -6px rgba(0, 0, 0, 0.4);
        cursor: ns-resize;
        touch-action: none;
      }
      .dial::after {
        /* the indicator line */
        content: "";
        position: absolute;
        left: 50%;
        top: 6px;
        width: 2.5px;
        height: 17px;
        margin-left: -1.25px;
        border-radius: 2px;
        background: var(--ink);
        transform-origin: 50% 21px;
        transform: rotate(var(--rot, -135deg));
      }
      .dial[data-accent="orange"] {
        --accent: var(--orange);
      }
      .dial[data-accent="blue"] {
        --accent: var(--blue);
      }
      .dial[data-accent="green"] {
        --accent: var(--green);
      }
      .dial[data-accent="yellow"] {
        --accent: var(--yellow);
      }
      .klabel {
        font-size: 9.5px;
        letter-spacing: 1.3px;
        color: var(--muted);
        text-transform: uppercase;
      }
      .kval {
        font-size: 10px;
        color: var(--ink);
      }

      /* ── transport row ────────────────────────────────────────────── */
      .transport {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 16px 20px;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        background: var(--panel-2);
      }
      .tbtn {
        appearance: none;
        border: 1px solid var(--line);
        background: #fff;
        color: var(--ink);
        height: 44px;
        padding: 0 18px;
        border-radius: 11px;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.6px;
        display: inline-flex;
        align-items: center;
        gap: 9px;
        cursor: pointer;
        box-shadow: 0 2px 0 #e3e0d8;
        transition:
          transform 0.04s,
          background 0.12s,
          color 0.12s;
      }
      .tbtn:active {
        transform: translateY(1px);
        box-shadow: 0 1px 0 #e3e0d8;
      }
      .tbtn .ico {
        font-size: 12px;
      }
      .tbtn.play.on {
        background: var(--orange);
        border-color: var(--orange);
        color: #fff;
        box-shadow: 0 2px 0 #c84100;
      }
      .nodes {
        margin-left: auto;
        display: flex;
        gap: 16px;
      }
      .node {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
        font-size: 9px;
        letter-spacing: 1px;
        color: var(--muted);
        text-transform: uppercase;
      }
      .node .led {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--led-off);
        box-shadow: 0 0 0 0 rgba(254, 80, 0, 0);
        transition:
          background 0.1s,
          box-shadow 0.1s;
      }
      .node.live .led {
        background: var(--orange);
        box-shadow: 0 0 0 4px rgba(254, 80, 0, 0.15);
      }

      /* ── keyboard ─────────────────────────────────────────────────── */
      .keys {
        position: relative;
        display: flex;
        gap: 4px;
        padding: 18px 20px 22px;
        background: var(--panel);
      }
      .key {
        appearance: none;
        flex: 1;
        position: relative;
        height: 116px;
        border: 1px solid var(--line);
        border-radius: 0 0 9px 9px;
        background: linear-gradient(#ffffff, #f4f2ec);
        cursor: pointer;
        box-shadow: 0 3px 0 #e3e0d8;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        gap: 3px;
        padding-bottom: 9px;
        font-size: 9px;
        letter-spacing: 0.5px;
        color: var(--muted);
        transition:
          transform 0.03s,
          background 0.06s;
        touch-action: none;
      }
      .key .hint {
        font-family: ui-monospace, monospace;
        opacity: 0.7;
      }
      .key.black {
        flex: 0 0 auto;
        width: 7%;
        height: 74px;
        margin: 0 -3.5%;
        z-index: 2;
        background: linear-gradient(#2b2b29, #161614);
        border-color: #0e0e0d;
        border-radius: 0 0 7px 7px;
        box-shadow: 0 3px 0 #000;
        color: #b7b3aa;
      }
      .key.down {
        transform: translateY(2px);
        box-shadow: 0 1px 0 #e3e0d8;
        background: var(--orange);
        color: #fff;
        border-color: var(--orange);
      }
      .key.black.down {
        background: #c84100;
        box-shadow: 0 1px 0 #000;
      }

      .foot {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        padding: 10px 20px 14px;
        font-size: 10px;
        letter-spacing: 0.6px;
        color: var(--muted);
        border-top: 1px solid var(--line);
        background: var(--panel-2);
      }
      .foot kbd {
        font-family: ui-monospace, monospace;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 0 5px;
        margin: 0 1px;
      }
    </style>
  </head>
  <body>
    <main class="device" id="device">
      <header class="head">
        <div class="brand"><span class="mark"></span>unworklet</div>
        <div class="model">UW-1 · pocket rack</div>
        <div class="power" id="power"><span class="led"></span>power</div>
      </header>

      <section class="top">
        <div class="display">
          <div class="row">
            <span class="big mono" id="dispNote">—</span>
            <span class="unit mono" id="dispHz">000 hz</span>
          </div>
          <div class="sub" id="dispStatus">idle · press play</div>
          <div class="meter"><i id="dispMeter"></i></div>
        </div>

        <div class="knobs" id="knobs">
          <div class="knob">
            <div class="dial" data-param="drive" data-accent="orange" data-value="0.6"></div>
            <span class="klabel">drive</span><span class="kval mono">0.60</span>
          </div>
          <div class="knob">
            <div class="dial" data-param="tone" data-accent="blue" data-value="0.5"></div>
            <span class="klabel">tone</span><span class="kval mono">0.50</span>
          </div>
          <div class="knob">
            <div class="dial" data-param="delay" data-accent="green" data-value="0.45"></div>
            <span class="klabel">delay</span><span class="kval mono">0.45</span>
          </div>
          <div class="knob">
            <div class="dial" data-param="fbk" data-accent="green" data-value="0.45"></div>
            <span class="klabel">fbk</span><span class="kval mono">0.45</span>
          </div>
          <div class="knob">
            <div class="dial" data-param="crush" data-accent="yellow" data-value="0.3"></div>
            <span class="klabel">crush</span><span class="kval mono">0.30</span>
          </div>
          <div class="knob">
            <div class="dial" data-param="vol" data-accent="" data-value="0.7"></div>
            <span class="klabel">vol</span><span class="kval mono">0.70</span>
          </div>
        </div>
      </section>

      <section class="transport">
        <button class="tbtn play" id="play"><span class="ico">▶</span>play</button>
        <button class="tbtn stop" id="stop"><span class="ico">■</span>stop</button>
        <div class="nodes" id="nodes">
          <div class="node" data-node="synth"><span class="led"></span>synth</div>
          <div class="node" data-node="drive"><span class="led"></span>drive</div>
          <div class="node" data-node="tape"><span class="led"></span>tape</div>
          <div class="node" data-node="crush"><span class="led"></span>crush</div>
        </div>
      </section>

      <section class="keys" id="keys"></section>

      <footer class="foot">
        <span
          >play with <kbd>a</kbd><kbd>w</kbd><kbd>s</kbd><kbd>e</kbd><kbd>d</kbd> … or click</span
        >
        <span class="mono">drag knobs ↕</span>
      </footer>
    </main>

    <script type="module" src="/src/ui.ts"></script>
  </body>
</html>
